name: Deploy example

on:
  push:
    branches: ["main"]
  # Allows a manual redeploy from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Let a running deployment finish instead of cancelling it, but keep only the
# most recent queued run so pushes in quick succession don't pile up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pnpm
        # v6.0.10
        # Version comes from the `packageManager` field in package.json
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Install Node.js
        # v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          package-manager-cache: false # Slower, but no cache poisoning risk
      - name: Install plugin dependencies
        # The example links to the repository root, so the plugin's own
        # dependencies have to be installed for it to resolve at build time.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install example dependencies
        # Build scripts stay enabled here because esbuild has to unpack its
        # binary. pnpm still only runs the ones allowed by the `allowBuilds`
        # list in example/pnpm-workspace.yaml.
        run: pnpm install --frozen-lockfile
        working-directory: example
      - name: Build the example
        run: pnpm build
        working-directory: example
      - name: Upload the example as a Pages artifact
        # v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: example/dist

  deploy: # Separate job so build-time dependencies can't deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write # Only this job may publish to Pages
      id-token: write # Verifies the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # v5.0.0
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
